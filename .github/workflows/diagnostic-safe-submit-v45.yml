name: Diagnostic cloud backup v46

on:
  push:
    paths:
      - 'scripts/diagnostic-safe-submit-v45.py'
      - '.github/workflows/diagnostic-safe-submit-v45.yml'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v46 patch
        run: python3 scripts/diagnostic-safe-submit-v45.py
      - name: Install Runtime Cache dependency
        run: npm install @vercel/functions@latest --save-exact
      - name: Verify patch
        run: |
          grep -q 'saveDiagnosticBackup' app/api/student/diagnostics/route.ts
          grep -q 'backup-results' app/teacher/diagnostics/diagnostic-results.tsx
          grep -q 'LAHONI_DIAGNOSTIC_RECOVERY' app/api/student/diagnostics/route.ts
          grep -q 'v46-diagnostic-cloud-backup' public/sw.js
          git diff --check
      - name: Audit runtime
        run: npm run audit:runtime
      - name: Build
        run: npm run build
      - name: Commit final changes
        run: |
          rm -f scripts/diagnostic-safe-submit-v45.py .github/workflows/diagnostic-safe-submit-v45.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'حفظ نتائج الاختبارات سحابيًا دون تعطيل الطالب'
          git push origin main
