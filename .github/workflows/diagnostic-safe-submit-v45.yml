name: Diagnostic safe submit v45

on:
  push:
    paths:
      - 'scripts/diagnostic-safe-submit-v45.py'
      - '.github/workflows/diagnostic-safe-submit-v45.yml'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v45 patch
        run: python3 scripts/diagnostic-safe-submit-v45.py
      - name: Verify patch
        run: |
          grep -q 'createDiagnosticRecoveryCode' lib/server/portal-auth.ts
          grep -q 'diagnostics/recover' app/student/student-diagnostics.tsx
          grep -q 'تم تصحيح الاختبار وحفظ النتيجة بأمان' app/api/student/diagnostics/route.ts
          grep -q 'v45-diagnostic-safe-submit' public/sw.js
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime
        run: npm run audit:runtime
      - name: Build
        run: npm run build
      - name: Commit final changes
        run: |
          rm -f scripts/diagnostic-safe-submit-v45.py .github/workflows/diagnostic-safe-submit-v45.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'حماية نتائج الاختبارات عند توقف المزامنة'
          git push origin main
