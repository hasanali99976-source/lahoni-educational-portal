name: Web build

on:
  push:
    branches:
      - main
      - fix/restore-design-subject-linking
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The repository lockfile currently lags package.json; install without rewriting it,
      # matching the verified production drain workflow until the lockfile is regenerated.
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run audit:runtime
      - run: npm run build
