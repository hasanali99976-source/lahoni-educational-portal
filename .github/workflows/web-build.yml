name: Web build

on:
  push:
    branches:
      - main
      - fix/restore-design-subject-linking
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run build
