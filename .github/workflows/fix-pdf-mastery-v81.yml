name: Fix PDF and Mastery v81

on:
  push:
    paths:
      - '.github/scripts/fix_pdf_mastery_v81.py'
      - '.github/workflows/fix-pdf-mastery-v81.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python .github/scripts/fix_pdf_mastery_v81.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          grep -q "data-student-row" app/teacher/attendance/page.tsx
          grep -q "data-grade-row" app/teacher/grades/page.tsx
          grep -q "الرصد غير مكتمل" app/teacher/follow-up/page.tsx
          grep -q 'model: "openai/gpt-5.4"' app/api/teacher/student-insight/route.ts
          grep -q "تحليل الطالب بالذكاء الاصطناعي" app/teacher/follow-up/page.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/attendance/page.tsx app/teacher/grades/page.tsx app/teacher/follow-up/page.tsx app/teacher/follow-up/follow-up.css app/api/teacher/student-insight/route.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: reliable one-page PDFs and simplify mastery"
            git push
          fi
