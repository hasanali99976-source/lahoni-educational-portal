name: Fix Paginated Clear Print v83

on:
  push:
    paths:
      - '.github/workflows/fix-paginated-print-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python .github/scripts/fix_paginated_print_v83.py

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: |
          grep -q 'renderAttendancePdfPages' app/teacher/attendance/page.tsx
          grep -q 'renderGradesPdfPages' app/teacher/grades/page.tsx
          grep -q 'PDF كامل — كل الطلاب' app/teacher/attendance/page.tsx
          grep -q 'PDF كامل — كل الطلاب' app/teacher/grades/page.tsx
          grep -q 'ostadh-lahooni-v83-paginated-clear-print' public/sw.js
          grep -q 'font-size: 10.5pt' app/globals.css

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/attendance/page.tsx app/teacher/grades/page.tsx public/sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: paginate attendance and grades PDFs with clear print type'
            git push
          fi
