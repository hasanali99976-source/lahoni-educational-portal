name: Grade Plan First Entry v96

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/grade_plan_first_entry_v96.py'
      - '.github/workflows/grade-plan-first-entry-v96.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply first-entry grade plan flow
        run: python .github/scripts/grade_plan_first_entry_v96.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify flow
        run: |
          grep -F 'const [hasGradePlan, setHasGradePlan]' app/teacher/layout.tsx
          grep -F 'window.location.replace("/teacher/grade-plan?setup=1")' app/teacher/layout.tsx
          grep -F 'grade-plan-mini-action' app/teacher/layout.tsx
          grep -F 'destination="/teacher/grade-plan?setup=1"' app/teacher/page.tsx
          grep -F 'ostadh-lahooni-v96-first-entry-plan' public/sw.js
          grep -F 'ostadh-lahooni-v96-first-entry-plan' app/pwa-register.tsx
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/layout.tsx app/teacher/page.tsx app/teacher/grades/page.tsx app/teacher/teacher-professional-v71.css app/pwa-register.tsx public/sw.js
          git commit -m 'feat: make grade plan mandatory on first teacher entry'
          git push origin main
