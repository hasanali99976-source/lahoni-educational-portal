name: Fix diagnostics classes and mobile v37

on:
  push:
    paths:
      - ".github/workflows/fix-diagnostics-mobile-v37.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply focused fixes
        run: python3 scripts/fix-diagnostics-mobile-v37.py

      - name: Verify removed fields
        shell: bash
        run: |
          if grep -RIn --include='*.tsx' -E 'السجل المدني|student\.nationalId|nationalId\?:' app/teacher; then
            echo "Visible national ID field still exists in teacher UI"
            exit 1
          fi
          git diff --check

      - name: Install and build
        run: |
          npm ci
          npm run audit:runtime
          npm run build

      - name: Commit fixes and clean temporary files
        shell: bash
        run: |
          rm -f .github/workflows/fix-diagnostics-mobile-v37.yml
          rm -f scripts/fix-diagnostics-mobile-v37.py
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "إصلاح تكرار الفصول وتداخل الجوال وإلغاء السجل المدني"
          git push origin main
