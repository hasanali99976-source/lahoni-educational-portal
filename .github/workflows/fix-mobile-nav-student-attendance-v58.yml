name: Fix mobile nav and student attendance v58

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-nav-student-attendance-v58.yml'
      - '.github/scripts/fix_mobile_nav_student_attendance_v58.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fixes
        run: python3 .github/scripts/fix_mobile_nav_student_attendance_v58.py

      - name: Verify scoped changes
        run: |
          grep -q 'v58 teacher mobile nav two rows' app/mobile-app-nav-fix.css
          grep -q 'grid-template-columns:repeat(3' app/mobile-app-nav-fix.css
          grep -q 'ATTENDANCE_START_DATE = "2026-08-23"' app/api/student/profile/route.ts
          grep -q 'date < ATTENDANCE_START_DATE' app/api/student/profile/route.ts
          grep -q 'attendanceSummary' app/api/student/lookup/route.ts
          grep -q 'ostadh-lahooni-v58-nav-student-attendance' public/sw.js

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/mobile-app-nav-fix.css app/api/student/profile/route.ts app/api/student/lookup/route.ts public/sw.js app/pwa-register.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'فصل أيقونات الجوال واستبعاد الحضور السابق من بوابة الطالب'
            git push origin main
          fi
