name: Reorder diagnostics v35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reorder-diagnostics-v35.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize class labels and reorder diagnostic page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/teacher/diagnostics/diagnostic-results.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''function classOf(student: Student) {
  return String(student.className || student.class || "").trim();
}
'''
          new = '''function classOf(student: Student) {
  return String(student.className || student.class || "").trim();
}

const CLASS_NUMBER_BY_LETTER: Record<string, string> = {
  "أ": "١", "ا": "١", "A": "١", "a": "١",
  "ب": "٢", "B": "٢", "b": "٢",
  "ج": "٣", "C": "٣", "c": "٣",
  "د": "٤", "D": "٤", "d": "٤",
  "هـ": "٥", "ه": "٥", "E": "٥", "e": "٥",
  "و": "٦", "F": "٦", "f": "٦",
  "ز": "٧", "G": "٧", "g": "٧",
};

function toArabicDigits(value: string) {
  return value.replace(/[0-9]/g, digit => "٠١٢٣٤٥٦٧٨٩"[Number(digit)]);
}

function classDisplay(value: string) {
  const raw = String(value || "").trim();
  if (!raw) return "فصل غير محدد";
  const cleaned = raw.replace(/^الفصل\s*/i, "").replace(/^فصل\s*/i, "").trim();
  const compact = cleaned.replace(/[\s()]/g, "");
  const mapped = CLASS_NUMBER_BY_LETTER[compact];
  if (mapped) return `الفصل ${mapped}`;
  if (/^[0-9٠-٩]+$/.test(compact)) return `الفصل ${toArabicDigits(compact)}`;
  const trailingLetter = cleaned.match(/(?:^|[\s\-\/])([أابجدهوزA-Ga-g])$/)?.[1];
  if (trailingLetter && CLASS_NUMBER_BY_LETTER[trailingLetter]) return `الفصل ${CLASS_NUMBER_BY_LETTER[trailingLetter]}`;
  return raw.startsWith("فصل") || raw.startsWith("الفصل") ? toArabicDigits(raw) : `الفصل ${toArabicDigits(raw)}`;
}

function classOrder(value: string) {
  const displayed = classDisplay(value);
  const digits = displayed.match(/[٠-٩0-9]+/)?.[0] || "999";
  return Number(digits.replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))) || 999;
}
'''
          if old not in text:
              raise SystemExit('classOf block not found')
          text = text.replace(old, new, 1)

          text = text.replace('.sort((a, b) => a.localeCompare(b, "ar", { numeric: true })), [students]);', '.sort((a, b) => classOrder(a) - classOrder(b) || a.localeCompare(b, "ar", { numeric: true })), [students]);', 1)
          text = text.replace('`لم يبدأ طلاب ${className} هذا الاختبار حتى الآن.', '`لم يبدأ طلاب ${classDisplay(className)} هذا الاختبار حتى الآن.', 1)
          text = text.replace('          className,\n          students:', '          className: classDisplay(className),\n          students:', 1)
          text = text.replace('          classOf(row.student),\n          diagnosticTitle,', '          classDisplay(classOf(row.student)),\n          diagnosticTitle,', 1)
          text = text.replace('<b>الفصل:</b> ${escapeHtml(className)}', '<b>الفصل:</b> ${escapeHtml(classDisplay(className))}', 1)

          start_marker = '    {!diagnosticsLoaded ? <p className="diag-empty">جارٍ تحميل الاختبارات الحالية…</p> : !diagnostics.length ? <p className="diag-empty">لا توجد اختبارات تشخيصية منشأة حتى الآن.</p> : null}\n\n'
          end_marker = '    {editing ? <div className="diag-modal" role="dialog" aria-modal="true">'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('diagnostic content markers not found')
          start += len(start_marker)

          replacement = '''    <div className="diag-list-tools diag-list-tools-first">
      <label>البحث عن طالب<input value={searchName} onChange={event => setSearchName(event.target.value)} placeholder="اكتب اسم الطالب" /></label>
      <label>حالة الاختبار<select value={statusFilter} onChange={event => setStatusFilter(event.target.value as StatusFilter)}><option value="all">جميع الطلاب</option><option value="completed">عملوا الاختبار</option><option value="pending">لم يعملوا الاختبار</option></select></label>
      <button onClick={() => { setSearchName(""); setStatusFilter("all"); }}>إظهار الجميع</button>
    </div>

    <div className="diagnostic-roster">
      {visibleRows.map((row, index) => {
        const result = row.result;
        const code = row.student.code || row.student.accessCode || row.student.studentCode || row.student.id;
        return <article key={row.student.id} className={result ? "completed" : "not-completed"}>
          <div className="diag-student-identity"><b>{index + 1}</b><div><strong>{row.student.name || "طالب دون اسم"}</strong><small>{classDisplay(classOf(row.student))} • {code}</small></div></div>
          <div className="diag-status-cell"><span className={result ? "status-done" : "status-pending"}>{result ? "✓ عمل الاختبار" : "○ لم يعمل الاختبار"}</span>{result ? <small>{formatDate(result.submittedAt)}</small> : <small>بانتظار دخول الطالب</small>}</div>
          <div className="diag-score-cell">{result ? <><strong>{result.score} / {result.total}</strong><span>{percentOf(result)}٪ • {resultLevel(result)}</span></> : <><strong>—</strong><span>لا توجد نتيجة</span></>}</div>
          <div className="diag-skills-cell"><small>المهارات الضعيفة</small><span>{result?.weakSkills?.length ? result.weakSkills.join("، ") : result ? "لا توجد مهارات ضعيفة مسجلة" : "تظهر بعد أداء الاختبار"}</span></div>
          <div className="diag-row-actions">{result ? <button onClick={() => openPlan(result)}>{result.teacherPlan ? "عرض الخطة المعتمدة" : result.aiPlan ? "عرض الخطة الذكية" : "اقتراح الخطة العلاجية"}</button> : <button disabled>لم يؤد الاختبار</button>}</div>
        </article>;
      })}
      {!visibleRows.length ? <p className="diag-empty">لا توجد أسماء مطابقة للبحث أو الحالة المحددة.</p> : null}
    </div>

    <div className="diag-stats">
      <article><strong>{rosterRows.length}</strong><span>طلاب الفصل</span></article>
      <article className="done"><strong>{completedCount}</strong><span>عملوا الاختبار</span></article>
      <article className="pending"><strong>{pendingCount}</strong><span>لم يعملوا الاختبار</span></article>
      <article><strong>{average}٪</strong><span>متوسط من اختبروا</span></article>
    </div>

    <section className="diag-ai-summary">
      <div className="diag-ai-icon">AI</div>
      <div><small>اقتراح الذكاء الاصطناعي للفصل</small><strong>{smartSummary}</strong><p>الخطط الذكية تُحفظ كاقتراح مستقل، ولا تستبدل خطة المعلم المعتمدة.</p></div>
      <button onClick={() => void generateAiPlans()} disabled={aiLoading || !completedCount}>{aiLoading ? "جارٍ تحليل النتائج…" : "اقتراح الخطط بالذكاء الاصطناعي"}</button>
    </section>

    {message ? <p className="diag-message">{message}</p> : null}

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('{classes.map(item => <option key={item} value={item}>{item}</option>)}', '{classes.map(item => <option key={item} value={item}>{classDisplay(item)}</option>)}', 1)
          path.write_text(text, encoding='utf-8')

          css = Path('app/teacher/diagnostics/diagnostic-results.css')
          css_text = css.read_text(encoding='utf-8')
          css_text += '''\n.diag-list-tools-first{margin-top:0;border:1px solid #dce7ef;background:linear-gradient(135deg,#f8fbfd,#f1f6fa)}\n.diagnostic-roster{margin-top:-8px}\n@media(max-width:760px){.diag-list-tools-first{position:relative;z-index:1}.diagnostic-roster{margin-top:-5px}}\n'''
          css.write_text(css_text, encoding='utf-8')

          pwa = Path('app/pwa-register.tsx')
          pwa.write_text(pwa.read_text(encoding='utf-8').replace('ostadh-lahooni-v34-diagnostics-mobile-nav', 'ostadh-lahooni-v35-diagnostics-order').replace('/sw.js?v=34-diagnostics-mobile-nav', '/sw.js?v=35-diagnostics-order'), encoding='utf-8')
          sw = Path('public/sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('ostadh-lahooni-v34-diagnostics-mobile-nav', 'ostadh-lahooni-v35-diagnostics-order'), encoding='utf-8')
          PY

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified diagnostics layout
        run: |
          rm .github/workflows/reorder-diagnostics-v35.yml
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/teacher/diagnostics/diagnostic-results.tsx app/teacher/diagnostics/diagnostic-results.css app/pwa-register.tsx public/sw.js .github/workflows/reorder-diagnostics-v35.yml
          git commit -m "ترتيب بوابة الاختبارات وعرض الفصول بالأرقام"
          git push origin main
