name: Reorder diagnostics v35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reorder-diagnostics-v35.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize and reorder diagnostics
        run: |
          echo '' | base64 -d > /tmp/reorder-diagnostics.py
          python /tmp/reorder-diagnostics.py

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified diagnostics layout
        run: |
          rm .github/workflows/reorder-diagnostics-v35.yml
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/teacher/diagnostics/diagnostic-results.tsx app/teacher/diagnostics/diagnostic-results.css app/pwa-register.tsx public/sw.js .github/workflows/reorder-diagnostics-v35.yml
          git commit -m "ترتيب بوابة الاختبارات وعرض الفصول بالأرقام"
          git push origin main
