name: Fix missing assigned attendance class

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-missing-assigned-class.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source fix
        run: python3 scripts/fix_missing_assigned_class.py

      - name: Verify source changes
        run: |
          grep -q "exactAssignmentClassIds" app/api/teacher/students/route.ts
          grep -q "defaultSelectedClassIds" app/api/teacher/students/route.ts
          grep -q "invalidOwnerDocumentIds" app/api/teacher/students/route.ts
          grep -q "subjectKey" lib/teacher-assignments.ts
          grep -q "v26-assigned-class" public/sw.js

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix
        run: |
          rm -f .github/workflows/fix-missing-assigned-class.yml
          rm -f scripts/fix_missing_assigned_class.py
          git config user.name "hasan taweel"
          git config user.email "hasan.ali99976@gmail.com"
          git add lib/teacher-assignments.ts app/api/teacher/students/route.ts public/sw.js .github/workflows/fix-missing-assigned-class.yml scripts/fix_missing_assigned_class.py
          git commit -m "إظهار الفصل المسند في التحضير وإصلاح الحجوزات القديمة"
          git push origin main
