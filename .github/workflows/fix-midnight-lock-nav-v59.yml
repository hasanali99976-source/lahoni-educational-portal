name: Fix midnight lock and mobile tabs v59

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-midnight-lock-nav-v59.yml'
      - '.github/scripts/fix_midnight_lock_nav_v59.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply midnight lock and tab fix
        run: python3 .github/scripts/fix_midnight_lock_nav_v59.py

      - name: Verify scoped changes
        run: |
          grep -q 'isFutureAttendanceDate' app/teacher/attendance/page.tsx
          grep -q 'futureDateLocked' app/teacher/attendance/attendance-schedule-guard.tsx
          grep -q 'dateInput.max' app/teacher/attendance/attendance-schedule-guard.tsx
          grep -q 'v59 single-row scrollable mobile tabs' app/mobile-app-nav-fix.css
          grep -q 'ostadh-lahooni-v59-midnight-lock-tabs' public/sw.js
          grep -q '59-midnight-lock-tabs' app/pwa-register.tsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/attendance/page.tsx app/teacher/attendance/attendance-schedule-guard.tsx app/mobile-app-nav-fix.css public/sw.js app/pwa-register.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'فصل تبويبات الجوال وقفل التحضير حتى بداية اليوم'
            git push origin main
          fi
