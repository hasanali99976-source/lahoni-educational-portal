name: Detach attendance from timetable v53

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/detach-attendance-timetable-v53.yml

permissions:
  contents: write

jobs:
  detach-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove timetable dependency from attendance only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/teacher/attendance/page.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace('type TimetableLesson = { className?: string };\n', '')
          text = text.replace('  const [timetableClasses, setTimetableClasses] = useState<string[]>([]);\n', '')

          start_marker = '''\n  useEffect(() => {\n    if (!ready) return;\n    const controller = new AbortController();\n    fetch(`/api/teacher/timetable?'''
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Timetable effect start was not found')
          end_marker = '\n  }, [ready, subjectKey]);\n'
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Timetable effect end was not found')
          end += len(end_marker)
          text = text[:start] + '\n' + text[end:]

          text = text.replace('      ...timetableClasses,\n', '')
          text = text.replace(
              '  }, [officialClasses, officialStudentClasses, assignedClasses, timetableClasses, students, assignmentScoped, assignments, subjectKey]);',
              '  }, [officialClasses, officialStudentClasses, assignedClasses, students, assignmentScoped, assignments, subjectKey]);',
          )
          text = text.replace('الفصل ظاهر في الجدول، لكن لا توجد له أسماء طلاب مسجلة بعد.', 'الفصل متاح، لكن لا توجد له أسماء طلاب مسجلة بعد.')
          text = text.replace('<span>مرتبط بالجدول</span>', '<span>مستقل عن الجدول</span>')
          text = text.replace('الفصل مرتبط بالجدول أو الإسناد، لكنه لا يحتوي طلابًا حتى الآن.', 'الفصل موجود ضمن الإسناد أو قائمة الطلاب، لكنه لا يحتوي طلابًا حتى الآن.')

          forbidden = ['/api/teacher/timetable', 'timetableClasses', 'TimetableLesson', 'مرتبط بالجدول', 'ظاهر في الجدول']
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(f'Attendance still references timetable: {found}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify scoped change
        run: |
          ! grep -nE 'timetableClasses|TimetableLesson|/api/teacher/timetable|مرتبط بالجدول|ظاهر في الجدول' app/teacher/attendance/page.tsx
          grep -n 'مستقل عن الجدول' app/teacher/attendance/page.tsx
          git diff -- app/teacher/attendance/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit verified detachment
        run: |
          rm .github/workflows/detach-attendance-timetable-v53.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/attendance/page.tsx .github/workflows/detach-attendance-timetable-v53.yml
          git commit -m 'فصل بوابة تحضير الطلاب عن الجدول الدراسي'
          git push
