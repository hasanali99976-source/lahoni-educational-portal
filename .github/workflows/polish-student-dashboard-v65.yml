name: Polish student dashboard v65

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-student-dashboard-v65.yml'
      - '.github/scripts/polish_student_dashboard_v65.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply student dashboard polish
        run: python3 .github/scripts/polish_student_dashboard_v65.py

      - name: Verify UI-only scope and one-page report
        run: |
          grep -q 'knowledge-subject-mini' app/student/page.tsx
          ! grep -q 'knowledge-subject-mark' app/student/page.tsx
          grep -q 'knowledge-subjects-action' app/student/page.tsx
          grep -q 'knowledge-logout-action' app/student/page.tsx
          grep -q 'print-dashboard-visuals' app/student/page.tsx
          grep -q 'print-unit-bars' app/student/page.tsx
          grep -q 'لوحة بيانية في صفحة واحدة' app/student/page.tsx
          grep -q '@page{size:A4 landscape' app/student/student-knowledge-v63.css
          grep -q 'height:190mm' app/student/student-knowledge-v63.css
          grep -q 'ostadh-lahooni-v65-student-visual-report' public/sw.js
          grep -q '65-student-visual-report' app/pwa-register.tsx
          git diff --exit-code -- app/api lib firestore.rules android-app

      - name: Install dependencies
        run: npm ci

      - name: Runtime audit
        run: npm run audit:runtime

      - name: Production build
        run: npm run build

      - name: Commit verified visual redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/student/page.tsx app/student/student-knowledge-v63.css public/sw.js app/pwa-register.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'تصغير هوية المادة وتحسين الأزرار وإضافة تقرير بياني من صفحة واحدة'
            git push origin main
          fi
