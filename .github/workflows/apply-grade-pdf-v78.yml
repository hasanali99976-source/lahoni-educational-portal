name: Apply Complete Grade PDF v78

on:
  push:
    paths:
      - '.github/workflows/apply-grade-pdf-v78.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python .github/scripts/fix_grade_print_pdf_v78.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify changes
        run: |
          grep -q 'downloadGradesPdf' app/teacher/grades/page.tsx
          grep -q 'تحميل PDF' app/teacher/grades/page.tsx
          grep -q 'ostadh-lahooni-v78-grade-pdf' public/sw.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/grades/page.tsx public/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: export every grade student to PDF'
          git push
