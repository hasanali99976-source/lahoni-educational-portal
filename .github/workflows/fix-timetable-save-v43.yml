name: Fix timetable save v43

on:
  push:
    paths:
      - ".github/workflows/fix-timetable-save-v43.yml"
      - "scripts/fix-timetable-save-v43.py"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply timetable save fix
        run: python3 scripts/fix-timetable-save-v43.py

      - name: Verify timetable fallback
        shell: bash
        run: |
          grep -q 'تم حفظ الجدول على هذا الجهاز' app/teacher/timetable/page.tsx
          grep -q 'ostadh-lahooni:timetable:' app/teacher/timetable/page.tsx
          grep -q 'syncQueue' app/teacher/timetable/page.tsx
          grep -q 'resource-exhausted' app/api/teacher/timetable/route.ts
          grep -q 'ostadh-lahooni-v43-timetable-local-save' app/pwa-register.tsx
          grep -q 'ostadh-lahooni-v43-timetable-local-save' public/sw.js
          git diff --check

      - name: Install and build
        run: |
          npm ci
          npm run audit:runtime
          npm run build

      - name: Commit and publish
        shell: bash
        run: |
          rm -f .github/workflows/fix-timetable-save-v43.yml
          rm -f scripts/fix-timetable-save-v43.py
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "إصلاح تعليق حفظ الجدول مع حفظ محلي آمن"
          git push origin main
