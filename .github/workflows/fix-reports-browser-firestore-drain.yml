name: Fix Runtime Drain Reads

# Production redeploy trigger after verified drain fixes. Retry after Vercel build window reopened.
on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/fix_reports_browser_firestore_drain.py"
      - ".github/scripts/fix_student_academic_polling.py"
      - ".github/scripts/fix_teacher_report_listener.py"
      - ".github/scripts/fix_teacher_roster_listeners.py"
      - ".github/scripts/fix_diagnostics_realtime_drain.py"
      - ".github/scripts/fix_portfolio_listener_drain.py"
      - ".github/scripts/disable_attendance_historical_autobackfill.py"
      - ".github/scripts/scope_student_profile_reads.py"
      - ".github/workflows/fix-reports-browser-firestore-drain.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Migrate reports reads to server API
        run: python .github/scripts/fix_reports_browser_firestore_drain.py

      - name: Stop student academic background polling
        run: python .github/scripts/fix_student_academic_polling.py

      - name: Stop teacher summary report listener
        run: python .github/scripts/fix_teacher_report_listener.py

      - name: Stop active teacher roster listeners
        run: python .github/scripts/fix_teacher_roster_listeners.py

      - name: Stop diagnostics realtime drain
        run: python .github/scripts/fix_diagnostics_realtime_drain.py

      - name: Stop portfolio realtime listener
        run: python .github/scripts/fix_portfolio_listener_drain.py

      - name: Stop attendance historical autobackfill
        run: python .github/scripts/disable_attendance_historical_autobackfill.py

      - name: Scope student profile reads
        run: python .github/scripts/scope_student_profile_reads.py

      - name: Install dependencies without changing lockfile
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Check runtime drain audit
        run: node scripts/runtime-audit.mjs

      - name: Check patch
        run: git diff --check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/reports/page.tsx app/teacher/report/page.tsx app/teacher/ai/page.tsx app/teacher/research/page.tsx app/api/teacher/attendance-report/route.ts app/student/academic-record/page.tsx app/teacher/diagnostics/page.tsx app/teacher/diagnostics/diagnostic-results.tsx app/teacher/portfolio/page.tsx app/teacher/attendance/page.tsx app/api/student/profile/route.ts scripts/runtime-audit.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(drain): eliminate active idle reads and scope student profile"
          git pull --rebase --autostash origin main
          git push origin main
