name: Build Sehat Hassoun Android APK
on:
  push:
    paths:
      - 'health-android/**'
      - '.github/workflows/build-health-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: health-android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp health-android/app/build/outputs/apk/debug/app-debug.apk Sehat-Hassoun-AlMazyon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sehat-Hassoun-AlMazyon-Android
          path: Sehat-Hassoun-AlMazyon.apk
