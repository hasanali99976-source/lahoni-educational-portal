name: Finalize attendance daily
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize_attendance_daily.py'
      - '.github/workflows/finalize-attendance-daily.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/finalize_attendance_daily.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/attendance/page.tsx
          git commit -m "fix(attendance): finalize daily flow and stop per-tap cloud writes"
          git push
