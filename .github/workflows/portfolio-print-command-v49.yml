name: Portfolio print command v49

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/portfolio-print-command-v49.yml

permissions:
  contents: write

jobs:
  fix-print-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch portfolio print command
        run: python3 scripts/patch-portfolio-print-v49.py
      - name: Verify print paths
        run: |
          grep -F 'function printPortfolio()' app/teacher/portfolio/page.tsx
          grep -F 'nativeWindow.OstadhApp.printPage(printTitle)' app/teacher/portfolio/page.tsx
          grep -F 'window.print();' app/teacher/portfolio/page.tsx
          grep -F 'إخراج ملف الإنجاز PDF' app/teacher/portfolio/page.tsx
          if grep -F 'data-native-print="true"' app/teacher/portfolio/page.tsx; then exit 1; fi
          grep -F 'ostadh-lahooni-v49-portfolio-print-command' public/sw.js
          git diff --check
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run build
      - name: Commit verified fix
        run: |
          rm -f .github/workflows/portfolio-print-command-v49.yml scripts/patch-portfolio-print-v49.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/portfolio/page.tsx public/sw.js .github/workflows/portfolio-print-command-v49.yml scripts/patch-portfolio-print-v49.py
          git commit -m 'إصلاح تشغيل طباعة ملف الإنجاز داخل التطبيق والمتصفح'
          git push origin main
