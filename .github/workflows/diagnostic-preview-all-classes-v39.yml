name: Diagnostic preview and all classes report v39

on:
  push:
    paths:
      - ".github/workflows/diagnostic-preview-all-classes-v39.yml"
      - "scripts/add-diagnostic-preview-all-classes-v39.py"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply diagnostic preview and report changes
        run: python3 scripts/add-diagnostic-preview-all-classes-v39.py

      - name: Verify requested features
        shell: bash
        run: |
          grep -q 'معاينة الاختبار' app/teacher/diagnostics/page.tsx
          grep -q 'الإجابة الصحيحة' app/teacher/diagnostics/page.tsx
          grep -q '<option value="all">جميع الفصول</option>' app/teacher/diagnostics/diagnostic-results.tsx
          grep -q 'pages.join' app/teacher/diagnostics/diagnostic-results.tsx
          grep -q 'page-break-before:always' app/teacher/diagnostics/diagnostic-results.tsx
          grep -q 'ostadh-lahooni-v39-diagnostic-preview-all-classes' app/pwa-register.tsx
          grep -q 'ostadh-lahooni-v39-diagnostic-preview-all-classes' public/sw.js
          git diff --check

      - name: Install and build
        run: |
          npm ci
          npm run audit:runtime
          npm run build

      - name: Commit and publish
        shell: bash
        run: |
          rm -f .github/workflows/diagnostic-preview-all-classes-v39.yml
          rm -f scripts/add-diagnostic-preview-all-classes-v39.py
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "إضافة معاينة الاختبار وتقرير جميع الفصول"
          git push origin main
