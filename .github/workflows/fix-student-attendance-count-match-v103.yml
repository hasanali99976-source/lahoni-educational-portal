name: Fix Student Attendance Count Match v103
on:
  push:
    branches: [fix/student-attendance-count-match-v103]
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded count fix
        run: python .github/scripts/fix_student_attendance_count_match_v103.py
      - name: Verify attendance semantics
        run: |
          grep -q 'teacher_saved_attendance' app/api/student/profile/route.ts
          grep -q 'teacher_saved_only' app/api/student/profile/route.ts
          grep -q 'automaticPresent = 0' app/api/student/profile/route.ts
          ! grep -q 'counts.present += 1; counts.total += 1; automaticPresent += 1' app/api/student/profile/route.ts
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run audit:runtime
      - run: npm run build
      - name: Commit verified source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/student/profile/route.ts
          git commit -m 'fix(attendance): match app counts to teacher records'
          git push
