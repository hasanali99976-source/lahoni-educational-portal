name: Diagnostic Full PDF v100

on:
  push:
    paths:
      - '.github/scripts/diagnostic_pdf_v100.py'
      - '.github/workflows/diagnostic-full-pdf-v100.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply diagnostic PDF patch
        run: python .github/scripts/diagnostic_pdf_v100.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify diagnostic PDF behavior
        run: |
          grep -q 'downloadDiagnosticPdfDocument' app/teacher/diagnostics/page.tsx
          grep -q 'PDF نسخة الطالب كاملة' app/teacher/diagnostics/page.tsx
          grep -q 'PDF نسخة المعلم بالإجابات' app/teacher/diagnostics/page.tsx
          grep -q 'pageQuestionGroups' lib/diagnostic-pdf.ts
          grep -q 'ostadh-lahooni-v100-diagnostic-full-pdf' public/sw.js
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/diagnostics/page.tsx lib/diagnostic-pdf.ts app/pwa-register.tsx public/sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: export complete diagnostic test PDFs'
            git push origin HEAD:main
          fi
