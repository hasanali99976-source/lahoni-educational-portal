name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK inside the website
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/downloads/ostadh-lahooni.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ostadh-lahooni.apk
          git commit -m "تحديث ملف تطبيق أستاذ لحوني للأندرويد" || exit 0
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostadh-lahooni-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
