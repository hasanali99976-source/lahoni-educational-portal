name: Add Colored All-Class Attendance PDF v85

on:
  push:
    paths:
      - '.github/workflows/add-attendance-all-classes-colors-v85.yml'
      - '.github/scripts/add_attendance_all_classes_colors_v85.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/add_attendance_all_classes_colors_v85.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          grep -q 'تحميل PDF لجميع الفصول' app/teacher/attendance/page.tsx
          grep -q 'ATTENDANCE_CLASS_COLORS' app/teacher/attendance/page.tsx
          grep -q 'accentColor' lib/class-pdf-pages-v83.ts
          grep -q 'ostadh-lahooni-v85-colored-all-attendance' public/sw.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/attendance/page.tsx lib/class-pdf-pages-v83.ts public/sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: add colored all-class attendance PDF'
            git push
          fi
