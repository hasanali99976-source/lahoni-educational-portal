name: Apply Real AI Mastery v80

on:
  push:
    paths:
      - '.github/workflows/apply-real-ai-mastery-v80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install AI SDK
        run: npm install ai@latest --save
      - name: Apply AI follow-up UI
        run: python .github/scripts/add_real_ai_followup_v80.py
      - name: Build
        run: npm run build
      - name: Verify
        run: |
          grep -q 'generateText' app/api/teacher/student-insight/route.ts
          grep -q 'requireSession("teacher")' app/api/teacher/student-insight/route.ts
          grep -q 'openai/gpt-5.6-luna' app/api/teacher/student-insight/route.ts
          grep -q 'تحليل وصياغة بالذكاء الاصطناعي' app/teacher/follow-up/page.tsx
          grep -q 'استخدام هذه الصياغة كملاحظة مخصصة' app/teacher/follow-up/page.tsx
          grep -q 'ostadh-lahooni-v80-real-ai-mastery' public/sw.js
          git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app/api/teacher/student-insight/route.ts app/teacher/follow-up/page.tsx app/teacher/follow-up/follow-up.css public/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add protected generative AI mastery insights'
          git push
