name: Apply Notes and Attendance Print v75

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-notes-print-v75.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python3 .github/scripts/apply_notes_print_v75.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify diff
        run: git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/attendance/page.tsx app/teacher/follow-up/page.tsx app/student/page.tsx app/student/student-portal-tabs.css public/sw.js
          git commit -m "fix: show note history and print all attendance students" || exit 0
          git push
