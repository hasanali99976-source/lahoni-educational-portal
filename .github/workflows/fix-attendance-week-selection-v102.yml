name: Fix Attendance Week Selection v102

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-attendance-week-selection-v102.py'
      - '.github/workflows/fix-attendance-week-selection-v102.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply weekly attendance patch
        run: python .github/scripts/fix-attendance-week-selection-v102.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify weekly report uses report date
        run: |
          grep -q 'const weekAnchor = reportFrom || selectedDate' app/teacher/attendance/page.tsx
          grep -q 'للتقرير الأسبوعي اختر أي تاريخ من الأسبوع المطلوب' app/teacher/attendance/page.tsx
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/attendance/page.tsx
          git commit -m 'fix: allow weekly attendance reports for selected weeks'
          git push
