name: Apply student roster and code lock fix v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-student-roster-lock-fix-v2.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch roster authority and deletion propagation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/api/teacher/students/route.ts",
              "        if (!official) return grades.has(item.student.grade as Grade) ? item : null;",
              "        if (!official) return null;",
          )

          replace_once(
              "app/api/teacher/students/route.ts",
              '''    const repairs: Repair[] = [];
              const existingIds = new Set(legacySnapshot.docs.map(item => item.id));
              const legacyIdentities = new Set(selectedLegacyRows.map(item => studentIdentity(item.student)));
              const now = new Date().toISOString();


              selectedLegacyRows.forEach(item => {''',
              '''    const repairs: Repair[] = [];
              const existingIds = new Set(legacySnapshot.docs.map(item => item.id));
              const legacyIdentities = new Set(selectedLegacyRows.map(item => studentIdentity(item.student)));
              const now = new Date().toISOString();

              allLegacyRows
                .filter(item => !centralByCode.has(item.student.code))
                .forEach(item => {
                  repairs.push({
                    path: `${subjectPath}/${item.id}`,
                    data: {
                      active: false,
                      rosterActive: false,
                      archived: true,
                      archivedAt: now,
                      updatedAt: now,
                      archiveReason: "removed_from_admin_roster",
                    },
                  });
                });

              selectedLegacyRows.forEach(item => {''',
          )

          replace_once(
              "app/api/student/lookup/route.ts",
              '''    const fallbackStudent = existingStudents
                .map(item => normalizeStudentRecord(item.data, item.studentId))
                .find((item): item is SchoolStudent => !!item);
              const student = centralStudent || fallbackStudent;''',
              '''    const student = centralStudent;''',
          )

          replace_once(
              "app/api/admin/students/[id]/route.ts",
              '''    const now = new Date().toISOString();
              await reference.set({ active: false, archivedAt: now, updatedAt: now }, { merge: true });
              return NextResponse.json({ ok: true });''',
              '''    const studentData = snapshot.data() as Record<string, unknown>;
              const studentCode = String(studentData.code || studentData.accessCode || studentData.studentCode || id).trim().toUpperCase();
              const now = new Date().toISOString();
              await reference.set({ active: false, archivedAt: now, updatedAt: now }, { merge: true });

              let archivedTeacherCopies = 0;
              try {
                const relatedPaths = new Set<string>();
                for (const field of ["code", "accessCode", "studentCode"] as const) {
                  const relatedSnapshot = await adminDb().collectionGroup("students").where(field, "==", studentCode).get();
                  relatedSnapshot.docs.forEach(document => {
                    const path = String(document.ref.path || "");
                    if (path.startsWith("portalV2Data/")) relatedPaths.add(path);
                  });
                }

                const paths = [...relatedPaths];
                for (let index = 0; index < paths.length; index += 400) {
                  const batch = adminDb().batch();
                  paths.slice(index, index + 400).forEach(path => {
                    const separator = path.lastIndexOf("/");
                    const itemReference = adminDb().collection(path.slice(0, separator)).doc(path.slice(separator + 1));
                    batch.set(itemReference, {
                      active: false,
                      rosterActive: false,
                      archived: true,
                      archivedAt: now,
                      updatedAt: now,
                      archiveReason: "removed_from_admin_roster",
                    }, { merge: true });
                  });
                  await batch.commit();
                }
                archivedTeacherCopies = paths.length;
              } catch (cascadeError) {
                console.warn("teacher student copies archive deferred", cascadeError);
              }

              return NextResponse.json({ ok: true, archivedTeacherCopies });''',
          )

          replace_once(
              "app/pwa-register.tsx",
              'const CURRENT_CACHE = "ostadh-lahooni-v31-stage-class-roster";\nconst RELOAD_KEY = "ostadh-lahooni-v31-stage-class-roster";',
              'const CURRENT_CACHE = "ostadh-lahooni-v32-admin-roster-lock";\nconst RELOAD_KEY = "ostadh-lahooni-v32-admin-roster-lock";',
          )
          replace_once(
              "app/pwa-register.tsx",
              'navigator.serviceWorker.register("/sw.js?v=31-stage-class-roster", { scope: "/", updateViaCache: "none" })',
              'navigator.serviceWorker.register("/sw.js?v=32-admin-roster-lock", { scope: "/", updateViaCache: "none" })',
          )
          replace_once(
              "public/sw.js",
              'const CACHE_NAME = "ostadh-lahooni-v31-stage-class-roster";',
              'const CACHE_NAME = "ostadh-lahooni-v32-admin-roster-lock";',
          )
          PY

      - name: Lock successful student code sessions inside student portal
        run: |
          cat > app/student/student-qr-lock.tsx <<'EOF'
          "use client";

          import { useEffect } from "react";

          const STUDENT_SESSION_KEY = "lahooni-student-qr-lock";
          const QR_ENTRIES = new Set(["qr", "iphone-qr", "qr-locked", "code-locked"]);
          const STUDENT_CODE_PATTERN = /^TH[123]\d{3}$/;
          const LOCK_STYLE_ID = "lahooni-student-code-lock-style";

          function normalizeStudentCode(value: string) {
            return value
              .replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))
              .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)))
              .trim()
              .toUpperCase();
          }

          function authenticatedStudentUiVisible() {
            return Boolean(document.querySelector(".student-clean, .student-subject-choices"));
          }

          export default function StudentQrLock() {
            useEffect(() => {
              const query = new URLSearchParams(window.location.search);
              const queryCode = normalizeStudentCode(query.get("code") || "");
              let locked = QR_ENTRIES.has(query.get("entry") || "") || STUDENT_CODE_PATTERN.test(queryCode);

              try {
                locked = locked || window.sessionStorage.getItem(STUDENT_SESSION_KEY) === "1";
              } catch {}

              const isBlockedPortalUrl = (href: string) => {
                try {
                  const url = new URL(href, window.location.href);
                  return url.origin === window.location.origin && !url.pathname.startsWith("/student");
                } catch {
                  return false;
                }
              };

              const applyLockedUi = () => {
                if (!locked) return;
                document.querySelectorAll<HTMLAnchorElement>("a[href]").forEach(link => {
                  const href = link.getAttribute("href") || "";
                  if (isBlockedPortalUrl(href)) link.remove();
                });
                document.querySelectorAll<HTMLElement>(".portal-back").forEach(item => item.remove());
              };

              const activateLock = () => {
                locked = true;
                try {
                  window.sessionStorage.setItem(STUDENT_SESSION_KEY, "1");
                } catch {}
                document.documentElement.classList.add("student-code-session");
                document.body.dataset.studentEntry = "code";

                if (!document.getElementById(LOCK_STYLE_ID)) {
                  const style = document.createElement("style");
                  style.id = LOCK_STYLE_ID;
                  style.textContent = `
                    html.student-code-session .portal-back,
                    html.student-code-session a[href="/"],
                    html.student-code-session a[href^="/?"],
                    body[data-student-entry="code"] .portal-back {
                      display: none !important;
                      visibility: hidden !important;
                      pointer-events: none !important;
                    }
                  `;
                  document.head.appendChild(style);
                }
                applyLockedUi();
              };

              const detectAuthenticatedEntry = () => {
                if (authenticatedStudentUiVisible()) activateLock();
                else applyLockedUi();
              };

              const returnToStudent = () => {
                if (locked && !window.location.pathname.startsWith("/student")) {
                  window.location.replace("/student?entry=code-locked");
                }
              };

              const blockPortalNavigation = (event: MouseEvent) => {
                if (!locked) return;
                const target = event.target instanceof Element ? event.target.closest<HTMLAnchorElement>("a[href]") : null;
                if (!target || !isBlockedPortalUrl(target.href)) return;
                event.preventDefault();
                event.stopPropagation();
                event.stopImmediatePropagation();
                window.location.replace("/student?entry=code-locked");
              };

              if (locked) activateLock();
              const observer = new MutationObserver(detectAuthenticatedEntry);
              observer.observe(document.body, { childList: true, subtree: true });
              document.addEventListener("click", blockPortalNavigation, true);
              window.addEventListener("popstate", returnToStudent);
              window.addEventListener("pageshow", returnToStudent);
              detectAuthenticatedEntry();
              window.setTimeout(detectAuthenticatedEntry, 50);
              window.setTimeout(detectAuthenticatedEntry, 500);

              return () => {
                observer.disconnect();
                document.removeEventListener("click", blockPortalNavigation, true);
                window.removeEventListener("popstate", returnToStudent);
                window.removeEventListener("pageshow", returnToStudent);
                document.documentElement.classList.remove("student-code-session");
                delete document.body.dataset.studentEntry;
                document.getElementById(LOCK_STYLE_ID)?.remove();
              };
            }, []);

            return null;
          }
          EOF

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified source fix
        run: |
          rm -f .github/workflows/apply-student-roster-lock-fix.yml .github/workflows/apply-student-roster-lock-fix-v2.yml
          git config user.name "ChatGPT Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/admin/students/[id]/route.ts app/api/teacher/students/route.ts app/api/student/lookup/route.ts app/student/student-qr-lock.tsx app/pwa-register.tsx public/sw.js .github/workflows/apply-student-roster-lock-fix.yml .github/workflows/apply-student-roster-lock-fix-v2.yml
          git commit -m "إلغاء الطلاب المحذوفين وقفل رجوع الطالب بعد الدخول بالكود"
          git push origin main
