name: Fix critical thinking exact class scope

on:
  push:
    branches:
      - fix-critical-thinking-class-7-v29

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-critical-thinking-class-7-v29
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source fix
        run: python3 scripts/fix-critical-thinking-class-scope-v29.py

      - name: Verify source
        run: |
          grep -q 'exactAssignmentEnforced' app/api/teacher/class-options/route.ts
          grep -q 'exactAssignmentEnforced' app/api/teacher/class-scope/route.ts
          grep -q 'assignmentAllowsClassExact' app/api/teacher/class-scope/route.ts
          grep -q 'v29-exact-class-assignment' app/pwa-register.tsx
          grep -q 'v29-exact-class-assignment' public/sw.js

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified fix
        run: |
          rm -f scripts/fix-critical-thinking-class-scope-v29.py
          rm -f .github/workflows/fix-critical-thinking-class-scope-v29.yml
          git config user.name "hasan taweel"
          git config user.email "hasan.ali99976@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "إلزام الإسناد بالفصل المحدد وإظهار طلابه"
            git push origin HEAD:fix-critical-thinking-class-7-v29
          fi
