name: Diagnose central class distribution

on:
  push:
    branches:
      - ops/restore-rosters-now

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print available classes and teacher assignments
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tahdheeb-history.vercel.app"
          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" /tmp/login.json /tmp/students.json /tmp/teachers.json' EXIT

          curl --fail-with-body --silent --show-error --output /tmp/login.json --cookie-jar "$COOKIE_JAR" --header 'content-type: application/json' --request POST "$BASE/api/auth/admin-name-login" --data '{"username":"حسن علي"}'
          curl --fail-with-body --silent --show-error --output /tmp/students.json --cookie "$COOKIE_JAR" "$BASE/api/admin/students"
          curl --fail-with-body --silent --show-error --output /tmp/teachers.json --cookie "$COOKIE_JAR" "$BASE/api/admin/teachers"

          node <<'NODE'
          const studentsResponse = require('/tmp/students.json');
          const teachersResponse = require('/tmp/teachers.json');
          const students = Array.isArray(studentsResponse.students) ? studentsResponse.students : [];
          const teachers = Array.isArray(teachersResponse.teachers) ? teachersResponse.teachers : [];
          const counts = {};
          for (const student of students) {
            const key = `${student.grade}-${student.section}`;
            counts[key] = (counts[key] || 0) + 1;
          }
          console.log('CLASS_COUNTS=' + JSON.stringify(Object.fromEntries(Object.entries(counts).sort())));
          for (const teacher of teachers) {
            console.log('TEACHER=' + JSON.stringify({ name: teacher.name, subjectIds: teacher.subjectIds, assignments: teacher.assignments }));
          }
          NODE
