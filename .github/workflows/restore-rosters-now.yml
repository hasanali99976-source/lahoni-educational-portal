name: Verify restored rosters

on:
  push:
    branches:
      - ops/restore-rosters-now

concurrency:
  group: verify-restored-rosters-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify roster and teacher assignments
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tahdheeb-history.vercel.app"
          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" /tmp/login.json /tmp/students.json /tmp/teachers.json' EXIT

          login_status=$(curl --fail-with-body --silent --show-error \
            --output /tmp/login.json --write-out '%{http_code}' \
            --cookie-jar "$COOKIE_JAR" \
            --header 'content-type: application/json' \
            --request POST "$BASE/api/auth/admin-name-login" \
            --data '{"username":"حسن علي"}')
          test "$login_status" = "200"

          students_status=$(curl --fail-with-body --silent --show-error \
            --output /tmp/students.json --write-out '%{http_code}' \
            --cookie "$COOKIE_JAR" "$BASE/api/admin/students")
          test "$students_status" = "200"

          teachers_status=$(curl --fail-with-body --silent --show-error \
            --output /tmp/teachers.json --write-out '%{http_code}' \
            --cookie "$COOKIE_JAR" "$BASE/api/admin/teachers")
          test "$teachers_status" = "200"

          node <<'NODE'
          const studentsResponse = require('/tmp/students.json');
          const teachersResponse = require('/tmp/teachers.json');
          const students = Array.isArray(studentsResponse.students)
            ? studentsResponse.students
            : (Array.isArray(studentsResponse) ? studentsResponse : []);
          const teachers = Array.isArray(teachersResponse.teachers) ? teachersResponse.teachers : [];
          const assignmentCount = teachers.reduce((sum, teacher) => sum + (Array.isArray(teacher.assignments) ? teacher.assignments.length : 0), 0);
          const teachersWithoutAssignments = teachers.filter(teacher => !Array.isArray(teacher.assignments) || teacher.assignments.length === 0).length;
          const classes = new Set(students.map(student => `${student.grade || ''}-${student.section || ''}`).filter(Boolean));
          console.log(JSON.stringify({
            students: students.length,
            classes: classes.size,
            teachers: teachers.length,
            assignments: assignmentCount,
            teachersWithoutAssignments,
          }));
          if (!studentsResponse.ok || students.length < 298) process.exit(1);
          if (!teachersResponse.ok || teachers.length === 0 || assignmentCount === 0) process.exit(1);
          NODE

          for path in / /admin /student /teacher /teacher/attendance; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE$path")
            test "$status" = "200"
          done

          echo "Roster and teacher assignment verification passed"
