name: Diagnose teacher roster matching

on:
  push:
    branches:
      - ops/restore-rosters-now

concurrency:
  group: diagnose-teacher-roster-matching
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare teacher assignments with central roster
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tahdheeb-history.vercel.app"
          COOKIE_JAR="$(mktemp)"
          trap 'rm -f "$COOKIE_JAR" /tmp/login.json /tmp/students.json /tmp/teachers.json' EXIT

          curl --fail-with-body --silent --show-error \
            --output /tmp/login.json \
            --cookie-jar "$COOKIE_JAR" \
            --header 'content-type: application/json' \
            --request POST "$BASE/api/auth/admin-name-login" \
            --data '{"username":"حسن علي"}'

          curl --fail-with-body --silent --show-error \
            --output /tmp/students.json \
            --cookie "$COOKIE_JAR" "$BASE/api/admin/students"

          curl --fail-with-body --silent --show-error \
            --output /tmp/teachers.json \
            --cookie "$COOKIE_JAR" "$BASE/api/admin/teachers"

          node <<'NODE'
          const studentsResponse = require('/tmp/students.json');
          const teachersResponse = require('/tmp/teachers.json');
          const students = Array.isArray(studentsResponse.students) ? studentsResponse.students : [];
          const teachers = Array.isArray(teachersResponse.teachers) ? teachersResponse.teachers : [];
          const arabicDigits = '٠١٢٣٤٥٦٧٨٩';
          const western = value => String(value ?? '').replace(/[٠-٩]/g, d => String(arabicDigits.indexOf(d))).replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
          const normalize = value => western(value).replace(/[\u064B-\u065F\u0670]/g, '').replace(/ـ/g, '').replace(/[إأآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase().trim();
          const ordinals = { اول:'1', الاول:'1', اولي:'1', الاولى:'1', ثاني:'2', الثاني:'2', ثانيه:'2', الثانيه:'2', ثالث:'3', الثالث:'3', ثالثه:'3', الثالثه:'3', رابع:'4', الرابع:'4', خامس:'5', الخامس:'5', سادس:'6', السادس:'6', سابع:'7', السابع:'7', ثامن:'8', الثامن:'8' };
          const numbers = value => normalize(value).replace(/[\/_\-–—]+/g, ' ').split(/\s+/).filter(Boolean).map(token => ordinals[token] || (/^\d+$/.test(token) ? token : '')).filter(Boolean);
          const gradeOf = value => {
            const exact = Number(western(value));
            if ([1,2,3].includes(exact)) return exact;
            const found = numbers(value).find(n => ['1','2','3'].includes(n));
            return found ? Number(found) : null;
          };
          const sectionOf = value => {
            const numeric = western(value).match(/\d+/g) || [];
            if (numeric.length) return numeric[numeric.length - 1];
            const parsed = numbers(value);
            return parsed.length ? parsed[parsed.length - 1] : '';
          };
          const allSections = value => ['', 'الكل', 'كل', 'جميع الفصول'].includes(normalize(value));

          console.log(`Central students: ${students.length}`);
          for (const teacher of teachers) {
            const assignments = Array.isArray(teacher.assignments) ? teacher.assignments : [];
            const rows = assignments.map(assignment => {
              const grade = gradeOf(assignment.grade);
              const section = allSections(assignment.section) ? '*' : sectionOf(assignment.section);
              const matched = students.filter(student => Number(student.grade) === grade && (section === '*' || String(student.section) === section)).length;
              return {
                subjectId: assignment.subjectId,
                gradeRaw: assignment.grade,
                sectionRaw: assignment.section,
                grade,
                section,
                matched,
              };
            });
            console.log(JSON.stringify({ teacher: teacher.name, subjectIds: teacher.subjectIds, assignments: rows }));
          }
          NODE
