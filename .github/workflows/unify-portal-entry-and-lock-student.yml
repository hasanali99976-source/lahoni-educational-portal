name: Unify Portal Entry And Lock Student
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/unify_portal_entry_and_lock_student.py'
      - '.github/workflows/unify-portal-entry-and-lock-student.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python .github/scripts/unify_portal_entry_and_lock_student.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/student/page.tsx app/teacher/page.tsx app/layout.tsx app/portal-entry-unified.css
          git commit -m 'fix(ui): lock student portal and unify login identity'
          git pull --rebase origin main
          git push origin main
