name: Link diagnostics and mastery to class scope v38

on:
  push:
    paths:
      - ".github/workflows/link-class-scope-v38.yml"
      - "scripts/link-diagnostics-mastery-to-class-scope-v38.py"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply class scope linkage
        run: python3 scripts/link-diagnostics-mastery-to-class-scope-v38.py

      - name: Verify linkage
        shell: bash
        run: |
          grep -q '/api/teacher/students?' app/teacher/diagnostics/diagnostic-results.tsx
          grep -q '/api/teacher/students?' app/teacher/follow-up/page.tsx
          grep -q 'scopeClasses.map' app/teacher/diagnostics/diagnostic-results.tsx
          grep -q 'scopeClasses.map' app/teacher/follow-up/page.tsx
          grep -q 'ostadh-lahooni-v38-class-scope' app/pwa-register.tsx
          grep -q 'ostadh-lahooni-v38-class-scope' public/sw.js
          git diff --check

      - name: Install and build
        run: |
          npm ci
          npm run audit:runtime
          npm run build

      - name: Commit and publish
        shell: bash
        run: |
          rm -f .github/workflows/link-class-scope-v38.yml
          rm -f scripts/link-diagnostics-mastery-to-class-scope-v38.py
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ربط بوابتي التشخيص والإتقان بالفصول المحددة"
          git push origin main
