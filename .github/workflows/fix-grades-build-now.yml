name: Fix gradebook build now
on:
  push:
    paths:
      - '.github/workflows/fix-grades-build-now.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair gradebook TypeScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/teacher/grades/page.tsx')
          s=p.read_text()
          old='''      const deductionRows=await Promise.all(changedIds.map(async studentId=>{'''
          new='''      const changedIds:string[]=Object.entries(deductionDirty).filter(([,changed])=>changed).map(([studentId])=>studentId);\n      const deductionRows=await Promise.all(changedIds.map(async (studentId:string)=>{'''
          if old not in s:
              raise SystemExit('target changedIds marker not found')
          s=s.replace(old,new,1)
          old2='''gradeDeductions:deductionMap.get(student.id)||student.gradeDeductions}:student));'''
          new2='''gradeDeductions:(deductionMap.get(student.id) as GradeDeduction[]|undefined)??student.gradeDeductions??[]}:student));'''
          if old2 not in s:
              raise SystemExit('target gradeDeductions marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/grades/page.tsx
          git commit -m "fix(grades): repair final save build" || exit 0
          git push origin main
