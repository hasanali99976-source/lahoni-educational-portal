name: Fix student post-login greeting

on:
  push:
    paths:
      - "scripts/fix-student-post-login-greeting.py"
      - ".github/workflows/fix-student-post-login-greeting.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch student greeting
        run: python scripts/fix-student-post-login-greeting.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/student/page.tsx
          git commit -m "Move student greeting after successful portal entry" || exit 0
          git push
