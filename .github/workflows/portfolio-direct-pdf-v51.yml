name: Portfolio direct PDF v51

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-direct-pdf-v51.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch direct PDF export
        run: python3 scripts/patch-portfolio-direct-pdf-v51.py

      - name: Install PDF renderer
        run: npm install --save html2canvas@1.4.1 jspdf@3.0.1

      - name: Verify direct PDF implementation
        run: |
          grep -q 'import("html2canvas")' app/teacher/portfolio/page.tsx
          grep -q 'OstadhApp?.saveBase64' app/teacher/portfolio/page.tsx
          grep -q 'تنزيل ملف PDF النهائي' app/teacher/portfolio/page.tsx
          grep -q 'ostadh-lahooni-v51-portfolio-direct-pdf' public/sw.js
          grep -q '51-portfolio-direct-pdf' app/pwa-register.tsx
          git diff --check

      - name: Runtime audit
        run: npm run audit:runtime

      - name: Production build
        run: npm run build

      - name: Commit verified direct PDF export
        run: |
          rm -f scripts/patch-portfolio-direct-pdf-v51.py
          rm -f .github/workflows/portfolio-direct-pdf-v51.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/portfolio/page.tsx app/pwa-register.tsx public/sw.js package.json package-lock.json scripts/patch-portfolio-direct-pdf-v51.py .github/workflows/portfolio-direct-pdf-v51.yml
          git commit -m "تنزيل ملف الإنجاز PDF مباشرة وحفظه في التنزيلات"
          git push origin main
