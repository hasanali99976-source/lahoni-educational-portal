name: Refine teacher mobile navigation v34

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-teacher-mobile-nav-v34.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Keep one mobile navigation and expose all commands
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          layout = Path('app/teacher/layout.tsx')
          text = layout.read_text(encoding='utf-8')
          text = text.replace('<b>القائمة</b>', '<b>كل الأوامر</b>', 1)
          text, count = re.subn(r'\n\s*<nav className="teacher-mobile-command-bar"[\s\S]*?</nav>\n\s*</div>', '\n  </div>', text, count=1)
          if count != 1:
              raise SystemExit('teacher mobile duplicate nav block not found')
          layout.write_text(text, encoding='utf-8')

          enhancer = Path('app/mobile-app-enhancer.tsx')
          text = enhancer.read_text(encoding='utf-8')
          text = text.replace('type IconName = "home" | "students" | "grades" | "tests" | "ai" | "admin" | "back";', 'type IconName = "home" | "students" | "attendance" | "grades" | "tests" | "ai" | "admin" | "back";', 1)
          text = text.replace('    students: <><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.4-4 2.3-6 5.5-6s5.1 2 5.5 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15 14.5c3.4-.4 5.3 1.4 5.5 4.5"/></>,\n    grades:', '    students: <><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.4-4 2.3-6 5.5-6s5.1 2 5.5 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15 14.5c3.4-.4 5.3 1.4 5.5 4.5"/></>,\n    attendance: <><path d="M7 3v3M17 3v3M4 8h16"/><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="m8 14 2.2 2.2L16 11"/></>,\n    grades:', 1)
          text = text.replace('      { href: "/teacher/students", label: "الطلاب", icon: "students" },\n      { href: "/teacher/grades", label: "الدرجات", icon: "grades" },', '      { href: "/teacher/students", label: "الطلاب", icon: "students" },\n      { href: "/teacher/attendance", label: "الحضور", icon: "attendance" },\n      { href: "/teacher/grades", label: "الدرجات", icon: "grades" },', 1)
          enhancer.write_text(text, encoding='utf-8')

          pwa = Path('app/pwa-register.tsx')
          pwa.write_text(pwa.read_text(encoding='utf-8').replace('ostadh-lahooni-v33-diagnostics-mobile', 'ostadh-lahooni-v34-diagnostics-mobile-nav').replace('/sw.js?v=33-diagnostics-mobile', '/sw.js?v=34-diagnostics-mobile-nav'), encoding='utf-8')
          sw = Path('public/sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('ostadh-lahooni-v33-diagnostics-mobile', 'ostadh-lahooni-v34-diagnostics-mobile-nav'), encoding='utf-8')
          PY

          cat > app/teacher/teacher-mobile-ux-v6.css <<'EOF'
          @media(max-width:760px){
            html,body{max-width:100%;overflow-x:hidden}
            .teacher-main{padding:68px 9px calc(92px + env(safe-area-inset-bottom))!important}
            .teacher-page-content{width:100%;max-width:100%;overflow:hidden}
            .teacher-menu-button{display:flex!important;min-height:47px!important;padding-inline:13px!important}
            .teacher-mobile-header{margin-top:0!important}
            .teacher-welcome-strip{margin-bottom:9px!important;padding:13px!important}
            .teacher-welcome-strip p{display:none}
            .teacher-ai-quick{min-width:48px!important;padding:7px!important}
            .teacher-page-content .card,.teacher-page-content section.card,.teacher-page-content .panel,.attendance-card,.gradebook-card,.smart-panel,.follow-card,.diagnostic-builder,.diagnostic-list,.portfolio-toolbar,.portfolio-cover,.portfolio-fields,.evidence-section,.portfolio-final-page{padding:14px!important;border-radius:17px!important}
            .teacher-page-content input,.teacher-page-content select,.teacher-page-content textarea{font-size:16px!important;min-height:48px!important}
            .teacher-page-content button,.teacher-page-content .btn{min-height:47px}
            .builder-actions,.portfolio-actions,.gradebook-actions,.attendance-controls,.report-selectors{display:grid!important;grid-template-columns:1fr!important;width:100%!important}
            .builder-actions button,.portfolio-actions button,.portfolio-actions a,.gradebook-actions button,.gradebook-actions a,.attendance-controls>button,.report-selectors button{width:100%!important}
            .questions-editor article{padding:12px!important}
            .answer-option{grid-template-columns:28px minmax(0,1fr)!important}
            .diagnostic-list article{align-items:stretch!important;gap:10px!important}
            .diagnostic-list article button{width:100%!important}
            .teacher-sidebar{z-index:260!important}
            .teacher-menu-backdrop{z-index:250!important}
          }
          EOF

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified navigation refinement
        run: |
          rm .github/workflows/refine-teacher-mobile-nav-v34.yml
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/teacher/layout.tsx app/teacher/teacher-mobile-ux-v6.css app/mobile-app-enhancer.tsx app/pwa-register.tsx public/sw.js .github/workflows/refine-teacher-mobile-nav-v34.yml
          git commit -m "توحيد تنقل بوابة المعلم وتحسين أوامر الجوال"
          git push origin main
