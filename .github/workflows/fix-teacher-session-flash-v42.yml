name: Fix teacher session flash v42

on:
  push:
    paths:
      - ".github/workflows/fix-teacher-session-flash-v42.yml"
      - "scripts/fix-teacher-session-flash-v42.py"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply teacher session isolation fix
        run: python3 scripts/fix-teacher-session-flash-v42.py

      - name: Verify session isolation
        shell: bash
        run: |
          grep -q 'const \[ready, setReady\] = useState(false)' app/teacher/layout.tsx
          grep -q 'function clearSessionState()' app/teacher/layout.tsx
          grep -q 'window.location.replace("/teacher")' app/teacher/layout.tsx
          grep -q 'credentials: "same-origin"' app/teacher/layout.tsx
          grep -q 'key={teacherId}' app/teacher/layout.tsx
          grep -q 'ostadh-lahooni-v42-teacher-session-isolation' app/pwa-register.tsx
          grep -q 'ostadh-lahooni-v42-teacher-session-isolation' public/sw.js
          git diff --check

      - name: Install and build
        run: |
          npm ci
          npm run audit:runtime
          npm run build

      - name: Commit and publish
        shell: bash
        run: |
          rm -f .github/workflows/fix-teacher-session-flash-v42.yml
          rm -f scripts/fix-teacher-session-flash-v42.py
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "منع ظهور بيانات المعلم السابق عند تبديل الحساب"
          git push origin main
