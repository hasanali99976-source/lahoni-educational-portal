name: Link Gradebook Student v99

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/link-gradebook-student-v99.py'
      - '.github/workflows/link-gradebook-student-v99.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply student-grade sync patch
        run: python .github/scripts/link-gradebook-student-v99.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify linked grade plan behavior
        run: |
          grep -q 'newestGradePlan' lib/use-grade-plan.ts
          grep -q 'gradePlanSnapshot: activePlan' app/teacher/grades/page.tsx
          grep -q 'chooseStudentGradePlan' app/api/student/profile/route.ts
          grep -q 'chooseStudentGradePlan' app/api/student/lookup/route.ts
          grep -q 'studentDataForPlan' app/student/page.tsx
          grep -q 'ostadh-lahooni-v99-gradebook-student-sync' public/sw.js

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/use-grade-plan.ts app/teacher/grades/page.tsx app/api/student/profile/route.ts app/api/student/lookup/route.ts app/student/page.tsx app/pwa-register.tsx public/sw.js
          git commit -m 'fix: link grade plan and scores to student portal'
          git push origin main
