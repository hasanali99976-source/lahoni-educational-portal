name: Apply Mobile Web Sync v72

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/apply_mobile_web_sync_v72.py"
      - ".github/workflows/apply-mobile-web-sync-v72.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Apply synchronized mobile and web fixes
        run: python .github/scripts/apply_mobile_web_sync_v72.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Check patch
        run: git diff --check

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/portfolio/page.tsx app/teacher/portfolio/portfolio.css app/pwa-register.tsx public/sw.js android-app/app/src/main/java/com/ostadlahooni/app/MainActivity.java android-app/app/build.gradle
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: unify app web sync and one-page mobile printing"
          git push origin main
