          python - <<'PY'
          from pathlib import Path

          layout = Path("app/teacher/layout.tsx")
          text = layout.read_text(encoding="utf-8")
          old_import = 'import "./mobile-card-tables.css";'
          new_import = 'import "./mobile-card-tables.css";\nimport "./teacher-mobile-ux-v6.css";'
          if old_import not in text:
              raise SystemExit("layout css import marker missing")
          text = text.replace(old_import, new_import, 1)

          old_tail = '''      </main>
              </div>
            </TeacherClientContext.Provider>;'''
          new_tail = '''      </main>
              <nav className="teacher-mobile-command-bar" aria-label="الأوامر السريعة للمعلم">
                {tabs.filter(tab => ["dashboard", "students", "attendance", "grades", "diagnostics"].includes(tab.key)).map(tab => {
                  const active = pathname.startsWith(tab.href);
                  return <Link key={`mobile-${tab.href}`} href={tab.href} className={active ? "active" : ""}><TabIcon type={tab.key}/><span>{tab.label}</span></Link>;
                })}
                <button type="button" onClick={() => setMenuOpen(true)} aria-label="عرض جميع أوامر بوابة المعلم"><i><b/><b/><b/><b/></i><span>كل الأوامر</span></button>
              </nav>
            </div>
          </TeacherClientContext.Provider>;'''
          if old_tail not in text:
              raise SystemExit("layout tail marker missing")
          layout.write_text(text.replace(old_tail, new_tail, 1), encoding="utf-8")

          pwa = Path("app/pwa-register.tsx")
          pwa_text = pwa.read_text(encoding="utf-8").replace("ostadh-lahooni-v32-admin-roster-lock", "ostadh-lahooni-v33-diagnostics-mobile").replace("/sw.js?v=32-admin-roster-lock", "/sw.js?v=33-diagnostics-mobile")
          pwa.write_text(pwa_text, encoding="utf-8")

          sw = Path("public/sw.js")
