name: Fix Attendance Cloud Source v102
on:
  push:
    branches: [fix/attendance-cloud-source-v102]
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded attendance cloud patch
        run: python .github/scripts/fix_attendance_cloud_source_v102.py
      - name: Verify unified attendance path
        run: |
          grep -q '/api/teacher/attendance/record' app/teacher/attendance/page.tsx
          grep -q 'savedThroughApiAt' app/api/teacher/attendance/record/route.ts
          ! grep -q 'getDoc(doc(db,attendancePath' app/teacher/attendance/page.tsx
          ! grep -q 'setDoc(doc(db,attendancePath' app/teacher/attendance/page.tsx
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run audit:runtime
      - run: npm run build
      - name: Commit verified source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/teacher/attendance/page.tsx
          git commit -m 'fix(attendance): use unified server cloud source'
          git push
