name: Fix Attendance Same Day Sync v104
on:
  push:
    branches: [fix/attendance-same-day-sync-v104]
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded attendance sync patch
        run: python .github/scripts/fix_attendance_same_day_sync_v104.py
      - name: Verify daily and cumulative attendance remain separate
        run: |
          grep -q 'latestDayCounts' app/api/student/profile/route.ts
          grep -q 'latestDayCounts' app/student/page.tsx
          grep -q 'آخر سجل حضور وانضباط' app/student/page.tsx
          grep -q 'explicitByDate.forEach' app/api/student/profile/route.ts
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run audit:runtime
      - run: npm run build
      - name: Commit verified source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/student/profile/route.ts app/student/page.tsx
          git commit -m 'fix(attendance): synchronize latest daily attendance across app and web'
          git push