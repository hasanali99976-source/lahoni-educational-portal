name: Portfolio print fix v48

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-print-fix-v48.yml

permissions:
  contents: write

jobs:
  fix-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Override legacy global print rules
        run: |
          cat >> app/teacher/portfolio/portfolio.css <<'CSS'

          /* v48: keep the dedicated portfolio A4 document above legacy global print rules */
          @media print{
            .print-header,.print-footer{display:none!important}
            .portfolio-page .portfolio-print-document .print-page{
              position:relative!important;
              display:block!important;
              width:210mm!important;
              min-width:210mm!important;
              max-width:210mm!important;
              min-height:297mm!important;
              margin:0!important;
              padding:15mm 16mm 14mm!important;
              overflow:hidden!important;
              break-after:page!important;
              page-break-after:always!important;
            }
            .portfolio-page .portfolio-print-document .print-page:last-child{
              break-after:auto!important;
              page-break-after:auto!important;
            }
            .portfolio-page .portfolio-print-cover,
            .portfolio-page .portfolio-print-final{
              position:relative!important;
              display:flex!important;
              color:#fff!important;
            }
            .portfolio-page .portfolio-print-cover h1,
            .portfolio-page .portfolio-print-cover h2,
            .portfolio-page .portfolio-print-cover h3,
            .portfolio-page .portfolio-print-cover p,
            .portfolio-page .portfolio-print-cover span,
            .portfolio-page .portfolio-print-cover strong,
            .portfolio-page .portfolio-print-cover small,
            .portfolio-page .portfolio-print-cover dt,
            .portfolio-page .portfolio-print-cover dd,
            .portfolio-page .portfolio-print-cover footer,
            .portfolio-page .portfolio-print-final h1,
            .portfolio-page .portfolio-print-final h2,
            .portfolio-page .portfolio-print-final h3,
            .portfolio-page .portfolio-print-final p,
            .portfolio-page .portfolio-print-final span,
            .portfolio-page .portfolio-print-final strong,
            .portfolio-page .portfolio-print-final small,
            .portfolio-page .portfolio-print-final footer{
              color:#fff!important;
            }
            .portfolio-page .portfolio-print-cover .print-cover-brand small,
            .portfolio-page .portfolio-print-cover>footer,
            .portfolio-page .portfolio-print-final>p,
            .portfolio-page .portfolio-print-final>footer{color:#d6ecef!important}
            .portfolio-page .portfolio-print-final>span,
            .portfolio-page .portfolio-print-final .print-share-link{color:#ffe3a0!important}
            .portfolio-page .print-section-header>span,
            .portfolio-page .print-achievement-number{color:#fff!important}
            .portfolio-page .print-section-header h2,
            .portfolio-page .portfolio-print-achievement>header h2{color:#10364d!important}
            .portfolio-page .print-section-header small,
            .portfolio-page .portfolio-print-achievement>header time{color:#607b88!important}
            .portfolio-page .print-stat-grid strong{color:#0b6174!important}
            .portfolio-page .print-stat-grid span{color:#577482!important}
            .portfolio-page .print-narrative h3,
            .portfolio-page .portfolio-print-reflection article h3,
            .portfolio-page .print-achievement-content h3{color:#0d6573!important}
            .portfolio-page .print-achievement-content p,
            .portfolio-page .print-narrative p,
            .portfolio-page .portfolio-print-reflection article p{color:#142f40!important}
            .portfolio-page .print-achievement-image{height:auto!important;max-height:105mm!important}
          }
          CSS
          sed -i 's/ostadh-lahooni-v47-smart-portfolio/ostadh-lahooni-v48-portfolio-print/g' public/sw.js
      - name: Verify print document
        run: |
          grep -q "v48: keep the dedicated portfolio" app/teacher/portfolio/portfolio.css
          grep -q "min-height:297mm!important" app/teacher/portfolio/portfolio.css
          grep -q "ostadh-lahooni-v48-portfolio-print" public/sw.js
          git diff --check
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run build
      - name: Commit verified print fix
        run: |
          rm -f .github/workflows/portfolio-print-fix-v48.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/teacher/portfolio/portfolio.css public/sw.js .github/workflows/portfolio-print-fix-v48.yml
          git commit -m "تثبيت طباعة ملف الإنجاز بصيغة A4"
          git push origin main
