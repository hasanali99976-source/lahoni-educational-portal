name: Link local timetable to attendance v44

on:
  push:
    paths:
      - ".github/workflows/link-local-timetable-to-attendance-v44.yml"
      - "scripts/link-local-timetable-to-attendance-v44.py"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply local timetable attendance link
        run: python3 scripts/link-local-timetable-to-attendance-v44.py

      - name: Verify attendance reads local timetable
        shell: bash
        run: |
          grep -q 'readLocalTimetable' app/teacher/attendance/attendance-schedule-guard.tsx
          grep -q 'mergeTimetable' app/teacher/attendance/attendance-schedule-guard.tsx
          grep -q 'ostadh-lahooni:timetable:' app/teacher/attendance/attendance-schedule-guard.tsx
          grep -q 'lahooni:timetable-updated' app/teacher/attendance/attendance-schedule-guard.tsx
          grep -q 'lahooni:timetable-updated' app/teacher/timetable/page.tsx
          grep -q 'ostadh-lahooni-v44-attendance-local-timetable' app/pwa-register.tsx
          grep -q 'ostadh-lahooni-v44-attendance-local-timetable' public/sw.js
          git diff --check

      - name: Install and build
        run: |
          npm ci
          npm run audit:runtime
          npm run build

      - name: Commit and publish
        shell: bash
        run: |
          rm -f .github/workflows/link-local-timetable-to-attendance-v44.yml
          rm -f scripts/link-local-timetable-to-attendance-v44.py
          git config user.name "ChatGPT Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "إظهار الحصص المحلية في التحضير قبل المزامنة"
          git push origin main
