name: Apply One Page Attendance PDF v77
on:
  push:
    paths:
      - '.github/workflows/apply-one-page-attendance-pdf-v77.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/apply-one-page-attendance-pdf-v77.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify changes
        run: |
          grep -q 'downloadAttendancePdf' app/teacher/attendance/page.tsx
          grep -q 'تحميل التحضير PDF' app/teacher/attendance/page.tsx
          grep -q 'entry.type === "other"' app/student/page.tsx
          grep -q 'entry.type === "other"' app/teacher/follow-up/page.tsx
          grep -q 'v77-one-page-pdf' public/sw.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teacher/attendance/page.tsx app/teacher/follow-up/page.tsx app/student/page.tsx public/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: download full attendance as one-page PDF'
          git push
