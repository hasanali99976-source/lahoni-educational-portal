name: Remove Evaluation Plans v88

on:
  push:
    paths:
      - '.github/workflows/remove-evaluation-plans-v88.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove evaluation plans feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Remove teacher navigation entry.
          layout = root / 'app/teacher/layout.tsx'
          text = layout.read_text(encoding='utf-8')
          text = text.replace('  { href: "/teacher/evaluation-plans", key: "evaluation", label: "خطط التقييم", note: "جدولة أدوات التقويم ودرجاتها" },\n', '')
          layout.write_text(text, encoding='utf-8')

          # Remove dashboard quick action.
          dashboard = root / 'app/teacher/dashboard/page.tsx'
          text = dashboard.read_text(encoding='utf-8')
          text = text.replace('        <Link className="daily-action" href="/teacher/evaluation-plans"><span>▣</span><div><b>خطط التقييم</b><small>جدولة الاختبارات والمهام وربطها بالفصول</small></div></Link>\n', '')
          dashboard.write_text(text, encoding='utf-8')

          # Remove mobile navigation item and icon.
          mobile = root / 'app/mobile-app-enhancer.tsx'
          text = mobile.read_text(encoding='utf-8')
          text = text.replace('type IconName = "home" | "students" | "attendance" | "grades" | "plans" | "tests" | "ai" | "admin" | "back";', 'type IconName = "home" | "students" | "attendance" | "grades" | "tests" | "ai" | "admin" | "back";')
          text = text.replace('    plans: <><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 2.8v3M16 2.8v3M7.5 9.5h9M8 13h3M14 13h2M8 16.5h5"/></>,\n', '')
          text = text.replace('      { href: "/teacher/evaluation-plans", label: "الخطط", icon: "plans" },\n', '')
          mobile.write_text(text, encoding='utf-8')

          # Force installed PWA clients to refresh after feature removal.
          pwa = root / 'app/pwa-register.tsx'
          text = pwa.read_text(encoding='utf-8')
          text = re.sub(r'const CURRENT_CACHE = "[^"]+";', 'const CURRENT_CACHE = "ostadh-lahooni-v88-no-evaluation-plans";', text, count=1)
          text = re.sub(r'const RELOAD_KEY = "[^"]+";', 'const RELOAD_KEY = "ostadh-lahooni-v88-no-evaluation-plans-reloaded";', text, count=1)
          text = re.sub(r'navigator\.serviceWorker\.register\("/sw\.js\?v=[^"]+"', 'navigator.serviceWorker.register("/sw.js?v=88-no-evaluation-plans"', text, count=1)
          pwa.write_text(text, encoding='utf-8')

          sw = root / 'public/sw.js'
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r'const CACHE_NAME = "[^"]+";', 'const CACHE_NAME = "ostadh-lahooni-v88-no-evaluation-plans";', text, count=1)
          sw.write_text(text, encoding='utf-8')

          # Remove the feature route and its styles.
          for path in [
              root / 'app/teacher/evaluation-plans/page.tsx',
              root / 'app/teacher/evaluation-plans/evaluation-plans.css',
          ]:
              if path.exists():
                  path.unlink()

          # Remove migration tooling that existed only to add/expose this feature.
          for rel in [
              '.github/scripts/rebuild_attendance_pdf_and_evaluation_plans_v86.py',
              '.github/scripts/fix_v86_evaluation_plan_types.py',
              '.github/workflows/rebuild-attendance-pdf-evaluation-plans-v86.yml',
              '.github/scripts/make_v87_visible_and_refresh.py',
              '.github/workflows/make-v87-visible-and-refresh.yml',
              '.github/workflows/remove-evaluation-plans-v88.yml',
          ]:
              path = root / rel
              if path.exists():
                  path.unlink()

          print('Evaluation plans feature removed; attendance PDF preserved.')
          PY

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify removal
        run: |
          test ! -e app/teacher/evaluation-plans/page.tsx
          test ! -e app/teacher/evaluation-plans/evaluation-plans.css
          ! grep -q '/teacher/evaluation-plans' app/teacher/layout.tsx
          ! grep -q '/teacher/evaluation-plans' app/teacher/dashboard/page.tsx
          ! grep -q '/teacher/evaluation-plans' app/mobile-app-enhancer.tsx
          ! grep -q 'خطط التقييم' app/teacher/layout.tsx
          ! grep -q 'خطط التقييم' app/teacher/dashboard/page.tsx
          grep -q 'ostadh-lahooni-v88-no-evaluation-plans' app/pwa-register.tsx
          grep -q 'ostadh-lahooni-v88-no-evaluation-plans' public/sw.js
          test -e lib/attendance-pdf.ts

      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove evaluation plans feature'
          git push
